<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Midnight Run</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;font-family:Arial,sans-serif;color:#fff;touch-action:none}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#172554,#020617 62%)}#wrap{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);max-width:1280px;max-height:720px;overflow:hidden;border:1px solid #ffffff22;box-shadow:0 25px 80px #000a}canvas{display:block;width:100%;height:100%}.screen{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(90deg,#020617f2,#020617b8);padding:20px}.hide{display:none}.card{width:min(850px,95%);height:min(470px,90%);display:grid;grid-template-columns:.8fr 1.2fr;overflow:hidden;border-radius:24px;border:1px solid #67e8f944;background:#071024e8}.pic{position:relative;overflow:hidden;background:radial-gradient(circle,#155e75aa,#020617 68%)}.pic img{position:absolute;height:108%;bottom:-6%;left:50%;transform:translateX(-50%);filter:drop-shadow(0 15px 14px #0009)}.txt{padding:38px;display:flex;flex-direction:column;justify-content:center}.tag{font-size:12px;letter-spacing:.22em;color:#67e8f9;font-weight:900}h1{font-size:clamp(42px,7vw,78px);line-height:.88;letter-spacing:-.06em;margin:9px 0 14px}.txt p,.modal p{color:#cbd5e1;line-height:1.55}.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 22px;font-size:12px;color:#cbd5e1}.keys span{border:1px solid #ffffff18;border-radius:10px;padding:8px;background:#ffffff08}.keys b{color:white}.go{border:0;border-radius:999px;padding:14px 25px;font-weight:900;font-size:15px;background:linear-gradient(135deg,#67e8f9,#38bdf8);color:#06121c;cursor:pointer;align-self:flex-start}.modal{width:min(430px,92%);text-align:center;padding:32px;border:1px solid #67e8f944;border-radius:22px;background:#071024ee}.modal h2{font-size:42px;margin:0}.big{font-size:34px;color:#fbbf24;font-weight:900;margin:10px 0 20px}#pause{position:absolute;right:13px;top:13px;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid #fff3;background:#020617aa;color:white;font-weight:bold;font-size:17px}#touch{position:absolute;z-index:3;left:0;right:0;bottom:12px;display:none;justify-content:space-between;padding:0 15px;pointer-events:none}.group{display:flex;gap:9px}.touch{pointer-events:auto;width:62px;height:62px;border-radius:17px;border:1px solid #fff3;background:#020617a8;color:white;font-size:24px;font-weight:bold}.jump{width:76px;height:76px;border-radius:50%;background:#67e8f9dd;color:#041018}@media(pointer:coarse),(max-width:760px){#touch{display:flex}.keys{display:none}.txt{padding:22px}.card{grid-template-columns:.7fr 1.3fr;height:82%}.txt p{font-size:13px}h1{font-size:45px}}@media(max-width:560px) and (orientation:portrait){#wrap{width:100vw;height:56.25vw;min-height:320px}.screen{padding:7px}.card{width:99%;height:96%}.txt{padding:14px}.tag{font-size:9px}.txt p{font-size:11px;margin:4px 0 12px}.go{padding:11px 17px}h1{font-size:36px}}
</style></head><body><div id="wrap"><canvas id="c" width="960" height="540"></canvas><button id="pause" class="hide">Ⅱ</button><div id="touch"><div class="group"><button class="touch" data-k="left">◀</button><button class="touch" data-k="right">▶</button></div><div class="group"><button class="touch" data-k="down">▼</button><button class="touch jump" data-k="jump">↑</button></div></div><div id="menu" class="screen"><div class="card"><div class="pic"><img id="portrait"></div><div class="txt"><div class="tag">2D NIGHT RUNNER</div><h1>MIDNIGHT<br>RUN</h1><p>Run through the neon city, dodge security obstacles, collect gold cases, and keep the suit clean.</p><div class="keys"><span><b>W / ↑ / Space</b><br>Jump</span><span><b>S / ↓</b><br>Duck</span><span><b>A / D</b><br>Move</span><span><b>P</b><br>Pause</span></div><button class="go" id="start">START RUN</button></div></div></div><div id="paused" class="screen hide"><div class="modal"><h2>Paused</h2><p>Press P or continue below.</p><button class="go" id="resume">RESUME</button></div></div><div id="over" class="screen hide"><div class="modal"><div class="tag">RUN COMPLETE</div><h2>Game Over</h2><p>Final score</p><div class="big" id="final">0</div><button class="go" id="again">RUN AGAIN</button></div></div></div>
<script src="sprite1.js"></script><script src="sprite2.js"></script><script src="sprite3.js"></script><script src="sprite4.js"></script><script>
(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),W=960,H=540,G=460,$=s=>document.querySelector(s),menu=$('#menu'),paused=$('#paused'),over=$('#over'),pb=$('#pause'),img=new Image();img.src=window.SPRITE_DATA;$('#portrait').src=window.SPRITE_DATA;let mode='menu',last=0,t=0,speed=330,score=0,next=1,coinNext=1.5,obs=[],coins=[],parts=[],keys={};const p={x:140,y:G-150,w:78,h:150,vy:0,j:0,lives:3,inv:0,duck:false,shield:0};
function reset(){mode='play';last=performance.now();t=score=0;speed=330;next=.9;coinNext=1.4;obs=[];coins=[];parts=[];Object.assign(p,{x:140,y:G-150,vy:0,j:0,lives:3,inv:0,duck:false,shield:0});menu.classList.add('hide');paused.classList.add('hide');over.classList.add('hide');pb.classList.remove('hide');pb.textContent='Ⅱ';requestAnimationFrame(loop)}
function jump(){if(mode==='play'&&p.j<2){p.vy=p.j?-610:-690;p.j++;p.duck=false;burst(p.x+38,G-4,'#67e8f9',9)}}function duck(v){if(mode==='play'&&p.y>=G-151)p.duck=v}function pause(){if(mode==='play'){mode='pause';paused.classList.remove('hide');pb.textContent='▶'}else if(mode==='pause'){mode='play';paused.classList.add('hide');pb.textContent='Ⅱ';last=performance.now();requestAnimationFrame(loop)}}function burst(a,b,col,n=14){while(n--)parts.push({x:a,y:b,vx:(Math.random()-.5)*220,vy:(Math.random()-.8)*180,l:.7,c:col})}function box(){let h=p.duck?86:140;return{x:p.x+18,y:G-h+(p.y-(G-150))+5,w:48,h:h-8}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function spawn(){let r=Math.random();obs.push(r<.48?{k:0,x:1000,y:G-62,w:60,h:62}:r<.8?{k:1,x:1000,y:G-104,w:47,h:104}:{k:2,x:1000,y:G-176,w:88,h:45})}function addCoin(){coins.push({x:1000,y:G-100-Math.random()*115,w:38,h:31,s:0,shield:Math.random()<.17})}
function update(d){t+=d;speed=Math.min(650,330+t*9);score+=d*speed/9.5;p.inv=Math.max(0,p.inv-d);p.shield=Math.max(0,p.shield-d);if(keys.left)p.x-=260*d;if(keys.right)p.x+=260*d;p.x=Math.max(55,Math.min(390,p.x));p.vy+=1900*d;p.y+=p.vy*d;if(p.y>=G-150){p.y=G-150;p.vy=0;p.j=0}if((next-=d)<=0){spawn();next=Math.max(.75,1.28-t*.004)+Math.random()*.48}if((coinNext-=d)<=0){addCoin();coinNext=1.4+Math.random()*1.8}let b=box();for(let o of obs){o.x-=speed*d;if(!o.dead&&hit(b,o)){o.dead=true;if(p.inv<=0){if(p.shield){p.shield=0;p.inv=.8;burst(p.x+40,p.y+60,'#67e8f9',22)}else{p.lives--;p.inv=1.3;burst(p.x+40,p.y+65,'#fb7185',25);if(!p.lives)return end()}}}}obs=obs.filter(o=>!o.dead&&o.x>-100);for(let q of coins){q.x-=speed*d;q.s+=d*5;if(!q.dead&&hit(b,q)){q.dead=true;if(q.shield){p.shield=8;score+=50;burst(q.x,q.y,'#67e8f9')}else{score+=100;burst(q.x,q.y,'#fbbf24')}}}coins=coins.filter(q=>!q.dead&&q.x>-60);for(let z of parts){z.l-=d;z.vy+=280*d;z.x+=z.vx*d;z.y+=z.vy*d}parts=parts.filter(z=>z.l>0)}
function rr(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.stroke()}}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050816');g.addColorStop(.65,'#0b1b3a');g.addColorStop(1,'#172554');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#dbeafe';x.beginPath();x.arc(790,83,27,0,7);x.fill();x.fillStyle='#09152e';x.beginPath();x.arc(801,76,25,0,7);x.fill();for(let i=0;i<70;i++){let sx=(i*83)%W,sy=18+(i*47)%250;x.globalAlpha=.25+.3*Math.sin(t*2+i);x.fillStyle='#e0f2fe';x.fillRect(sx,sy,2,2)}x.globalAlpha=1;for(let i=0;i<15;i++){let bx=(i*83-t*speed*.07)%(W+250);if(bx<-100)bx+=W+250;let bh=90+(i*39)%210,bw=55+(i*17)%55;x.fillStyle=i%2?'#0b1730':'#08142c';x.fillRect(bx,G-bh,bw,bh);x.fillStyle='#fbbf2433';for(let yy=G-bh+15;yy<G-15;yy+=24)for(let xx=bx+10;xx<bx+bw-8;xx+=18)if((i+yy)%3)x.fillRect(xx,yy,6,8)}x.fillStyle='#07101e';x.fillRect(0,G,W,H-G);x.fillStyle='#162033';x.fillRect(0,G,W,7);x.strokeStyle='#67e8f933';x.lineWidth=2;x.setLineDash([28,32]);x.lineDashOffset=-t*speed*.7;x.beginPath();x.moveTo(0,506);x.lineTo(W,506);x.stroke();x.setLineDash([])}
function draw(){bg();for(let q of coins){x.save();x.translate(0,Math.sin(q.s)*5);if(q.shield){x.shadowColor='#67e8f9';x.shadowBlur=18;x.lineWidth=5;x.strokeStyle='#67e8f9';x.beginPath();x.arc(q.x+19,q.y+19,16,0,7);x.stroke();x.fillStyle='#e0f2fe';x.font='bold 16px Arial';x.fillText('S',q.x+14,q.y+25)}else{x.shadowColor='#fbbf24';x.shadowBlur=13;rr(q.x,q.y,40,31,6,'#f59e0b','#fde68a');x.strokeStyle='#fde68a';x.strokeRect(q.x+12,q.y-6,16,8)}x.restore()}for(let o of obs){if(o.k===0){x.lineWidth=3;rr(o.x,o.y,o.w,o.h,7,'#7f1d1d','#fb7185');x.beginPath();x.moveTo(o.x+8,o.y+8);x.lineTo(o.x+o.w-8,o.y+o.h-8);x.moveTo(o.x+o.w-8,o.y+8);x.lineTo(o.x+8,o.y+o.h-8);x.stroke()}else if(o.k===1){x.lineWidth=4;rr(o.x,o.y,o.w,o.h,6,'#111827','#f97316');x.fillStyle='#f97316';for(let y=o.y+10;y<o.y+o.h;y+=24)x.fillRect(o.x+4,y,o.w-8,9)}else{x.shadowColor='#67e8f9';x.shadowBlur=15;x.lineWidth=3;rr(o.x,o.y,o.w,o.h,18,'#172554','#67e8f9');x.shadowBlur=0;x.fillStyle='#fb7185';x.beginPath();x.arc(o.x+44,o.y+23,7,0,7);x.fill()}}let dh=p.duck?90:150,dw=p.duck?88:78,dy=p.duck?G-dh:p.y,dx=p.x-(dw-p.w)/2;x.save();if(p.inv&&Math.floor(p.inv*12)%2===0)x.globalAlpha=.28;if(p.shield){x.shadowColor='#67e8f9';x.shadowBlur=20;x.lineWidth=4;x.strokeStyle='#67e8f9';x.beginPath();x.ellipse(dx+dw/2,dy+dh/2,dw*.7,dh*.56,0,0,7);x.stroke()}x.shadowColor='#000';x.shadowBlur=12;x.drawImage(img,dx,dy,dw,dh);x.restore();x.fillStyle='#0006';x.beginPath();x.ellipse(p.x+39,G+4,p.duck?48:34,8,0,0,7);x.fill();for(let z of parts){x.globalAlpha=z.l/.7;x.fillStyle=z.c;x.fillRect(z.x,z.y,4,4)}x.globalAlpha=1;rr(18,18,235,72,18,'#020617aa','#67e8f944');x.fillStyle='#94a3b8';x.font='bold 12px Arial';x.fillText('SCORE',35,41);x.fillStyle='white';x.font='bold 28px Arial';x.fillText(String(Math.floor(score)).padStart(5,'0'),35,72);x.fillStyle='#94a3b8';x.font='bold 12px Arial';x.fillText('LIVES',151,41);for(let i=0;i<3;i++){x.fillStyle=i<p.lives?'#fb7185':'#475569';x.beginPath();x.arc(164+i*22,65,7,0,7);x.fill()}if(p.shield){rr(395,22,170,32,16,'#020617aa');rr(400,27,160*(p.shield/8),22,11,'#67e8f9');x.fillStyle='#06121c';x.font='bold 12px Arial';x.textAlign='center';x.fillText('SHIELD',480,43);x.textAlign='left'}}
function loop(n){if(mode!=='play')return;let d=Math.min(.033,(n-last)/1000);last=n;update(d);draw();if(mode==='play')requestAnimationFrame(loop)}function end(){mode='over';$('#final').textContent=Math.floor(score);over.classList.remove('hide');pb.classList.add('hide')}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=1;if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=1;if(['KeyW','ArrowUp','Space'].includes(e.code)&&!e.repeat)jump();if(['KeyS','ArrowDown'].includes(e.code))duck(true);if(e.code==='KeyP'&&!e.repeat)pause()},{passive:false});addEventListener('keyup',e=>{if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=0;if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=0;if(['KeyS','ArrowDown'].includes(e.code))duck(false)});for(let b of document.querySelectorAll('.touch')){let k=b.dataset.k,on=e=>{e.preventDefault();if(k==='jump')jump();else if(k==='down')duck(true);else keys[k]=1},off=e=>{e.preventDefault();if(k==='down')duck(false);else if(k!=='jump')keys[k]=0};b.onpointerdown=on;b.onpointerup=b.onpointercancel=b.onpointerleave=off}$('#start').onclick=$('#again').onclick=reset;$('#resume').onclick=pb.onclick=pause;addEventListener('blur',()=>{if(mode==='play')pause()});img.onload=draw;draw()})();
</script></body></html>
